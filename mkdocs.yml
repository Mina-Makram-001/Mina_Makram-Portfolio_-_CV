site_name: Mina Makram - Portfolio & CV
site_description: Data Scientist & Machine Learning Engineer | Personal Portfolio
site_author: Mina Makram Riad
site_url: https://github.com/Mina-Makram-001

repo_name: My Github Portfolio
repo_url: https://github.com/Mina-Makram-001
edit_uri: edit/main/docs/

nav:
  - Home: index.md

  - About:
      - About Me: ABOUT/about-me.md

  - Experience:
      - Experience: EXPERIENCE/experience.md

  - Projects:
      - Projects: PROJECTS/projects.md

  - Skills:
      - Skills: SKILLS/skills.md

  - Education:
      - Education: EDUCATION/education.md
      
  - Contact:
      - Contact: contact.md   # Update folder path if located elsewhere

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------
theme:
  name: material
  language: en

  favicon: assets/images/me.jpeg

  logo: assets/images/me.jpeg

  font:
    text: Inter
    code: JetBrains Mono

  palette:
    # ─────────────────────────────
    # LIGHT MODE
    # ─────────────────────────────
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # ─────────────────────────────
    # DARK MODE
    # ─────────────────────────────
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:

    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking

    # Search
    - search.suggest
    - search.highlight
    - search.share

    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

    # Footer
    - navigation.footer

# -----------------------------------------------------------------------------
# Custom CSS / JS
# -----------------------------------------------------------------------------
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js



# -----------------------------------------------------------------------------
# DRY variables (mkdocs-macros)
# -----------------------------------------------------------------------------
extra:
  brand:
    dark_blue: "#004475"
    light_blue: "#68ade0"
    dark_gray: "#1f1f1f"
    mid_gray: "#575757"
    light_gray: "#d9d9d9"
  author: Mina Makram
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/mina-makram-32b342324/?locale=en
      name: linkedin
  generator: false

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - search
  - awesome-pages
  - macros
  - glightbox
  - mkdocs-jupyter:
      include_source: true
      execute: false
  - minify:
      minify_html: true

# -----------------------------------------------------------------------------
# Markdown extensions
# -----------------------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [includes, docs/includes]
      check_paths: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format